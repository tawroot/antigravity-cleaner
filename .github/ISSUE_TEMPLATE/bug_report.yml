name: "🐛 گزارش باگ / Bug Report"
description: "ثبت سریع گزارش باگ یا خطای عملکردی در Antigravity Cleaner"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚡ سپاس از گزارش شما / Thank you for helping improve Antigravity Cleaner!
        - قبل از ارسال، پیشنهاد می‌شود دستور `antigravity auto-fix` را یک‌بار اجرا کنید.
        - **توجه:** اگر با خطای **`HTTP 400 (User location is not supported)`** یا خطای پروکسی مواجه شدید، این مورد ناشی از نشت لوکیشن/فیلترشکن است و باگ کلینر نیست. لطفاً از قالب **«❓ پرسش و عیب‌یابی شبکه»** استفاده نمایید.

  - type: textarea
    id: description
    attributes:
      label: "شرح مشکل / Problem Description"
      description: "توضیح کوتاه در مورد خطایی که رخ داده است / Describe what happened and what you expected."
      placeholder: "مثال: هنگام زدن Auto-Fix در مک، پیام فلان خطا نمایش داده می‌شود..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "سیستم‌عامل / Operating System"
      options:
        - "Linux"
        - "Windows"
        - "macOS"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "خروجی داکتر یا لاگ خطا (اختیاری) / Doctor Output or Logs (Optional)"
      description: "خروجی دستور `antigravity doctor` یا متن خطا را در صورت تمایل اینجا قرار دهید:"
      placeholder: "Paste logs or doctor output here (optional)..."
      render: shell
    validations:
      required: false
