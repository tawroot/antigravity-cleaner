name: "❓ پرسش و عیب‌یابی شبکه / Question & Troubleshooting"
description: "پرسش درباره خطاهای لوکیشن (400/403)، نشت آی‌پی، تنظیمات پروکسی یا راهنمایی استفاده"
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 قبل از ارسال این پرسش / Before submitting:
        - اگر با خطای **`HTTP 400: User location is not supported`** یا **`HTTP 403`** مواجه شده‌اید:
          1. این خطاها ناشی از **نشت IPv6، نشت DNS یا سرور فیلترشکن** است و باگ نرم‌افزاری نیست.
          2. ادیتور را کاملاً ببندید و یک‌بار در کلینر دکمه **Clean** (یا دستور `clean`) را بزنید تا توکن‌های مسموم تحریم تخلیه شوند.
          3. برنامه را حتماً از طریق کلینر با دکمه **Launch** (یا شورتکات ساخته‌شده `Antigravity-NoTUN`) اجرا کنید.
          4. کشور اکانت خود را در [Google Country Association](https://policies.google.com/country-association-form?hl=en-US&source=policies-site) بررسی کنید.

  - type: textarea
    id: description
    attributes:
      label: "شرح پرسش یا مشکل شبکه / Question or Network Issue Description"
      description: "توضیح دهید چه مشکلی در اتصال یا تنظیمات رخ داده است / Describe your question or connectivity issue."
      placeholder: "مثال: هنگام ارسال پرامپت با خطای ۴۰۰ مواجه می‌شوم با اینکه پروکسی متصل است..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "سیستم‌عامل / Operating System"
      options:
        - "Windows"
        - "Linux"
        - "macOS"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: doctor_logs
    attributes:
      label: "📋 گزارش تشخیصی سیستم / Diagnostic Report (ag-cleaner report)"
      description: "دستور `ag-cleaner report` را در ترمینال یا پاورشل اجرا کرده و متن کپی‌شده را اینجا پیست (Ctrl+V) نمایید / Run 'ag-cleaner report' and paste it here:"
      placeholder: "Paste output of `ag-cleaner report` here..."
      render: markdown
    validations:
      required: false

  - type: textarea
    id: agent_error
    attributes:
      label: "💬 متن یا اسکرین‌شات ارور ایجنت در ادیتور / Agent Error Message or Screenshot"
      description: "پیام خطایی که ایجنت در چت ادیتور می‌دهد (مانند Error ID یا Terminated) را پیست کنید یا اسکرین‌شات آن را در این کادر بیندازید:"
      placeholder: "مثال: Error: Agent execution terminated due to error. (Error ID: ...)"
    validations:
      required: false

  - type: input
    id: proxy_client
    attributes:
      label: "🛡️ کلاینت فیلترشکن و کشور سرور / Active Proxy Client & Server Location"
      description: "نام برنامه پروکسی و کشوری که متصل هستید را بنویسید (اختیاری ولی بسیار کمک‌کننده):"
      placeholder: "مثال: v2rayN با سرور آلمان / Hiddify / Clash / NekoBox"
    validations:
      required: false
