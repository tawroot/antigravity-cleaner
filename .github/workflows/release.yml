name: Release & Multi-Platform Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run Verification Tests
        run: |
          go test -v ./...

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          echo "Building Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/antigravity-cleaner-linux-amd64 ./cmd/antigravity
          
          echo "Building Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/antigravity-cleaner-linux-arm64 ./cmd/antigravity
          
          echo "Building macOS amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/antigravity-cleaner-darwin-amd64 ./cmd/antigravity
          
          echo "Building macOS arm64 (Apple Silicon)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/antigravity-cleaner-darwin-arm64 ./cmd/antigravity
          
          echo "Building Windows amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/antigravity-cleaner-windows-amd64.exe ./cmd/antigravity

      - name: Generate SHA-256 Checksums
        working-directory: dist
        run: |
          sha256sum antigravity-cleaner-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/antigravity-cleaner-linux-amd64
            dist/antigravity-cleaner-linux-arm64
            dist/antigravity-cleaner-darwin-amd64
            dist/antigravity-cleaner-darwin-arm64
            dist/antigravity-cleaner-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
