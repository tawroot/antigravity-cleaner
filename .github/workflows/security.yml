name: Security & Quality Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # Weekly security audit

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Go Security Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Go Vet & Formatting
        run: |
          go vet ./...

      - name: Run Tests with Race Detector
        run: |
          go test -v -race ./...

      - name: Install & Run Govulncheck (Vulnerability Analysis)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
